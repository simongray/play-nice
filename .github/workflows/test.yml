name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Java 25, Node 24
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn') }}

      # The build runs the tests itself, but exits 0 when one fails, so
      # node runs the built file, and its exit code fails the step.
      - name: Node tests
        run: |
          npm ci
          clojure -M:cljs compile test --config-merge '{:autorun false}'
          node target/node-tests.js

      - name: Node tests, compiled with advanced optimizations
        run: |
          clojure -M:cljs release test --config-merge '{:autorun false}'
          node target/node-tests.js

      # The browser tests, compiled with advanced optimizations and no infer
      # warnings. They run in the runner's own Chrome, since Playwright's
      # Chromium can't play AAC or H.264, and in Playwright's Firefox and
      # WebKit.
      - name: Browser tests in Chrome, Firefox and WebKit
        run: |
          npx playwright install --with-deps firefox webkit
          clojure -M:cljs release browser-test
          node test/browsers.mjs

      - name: Lint
        run: clojure -Sdeps '{:deps {clj-kondo/clj-kondo {:mvn/version "2026.08.04"}}}' -M -m clj-kondo.main --lint src test
